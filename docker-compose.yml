services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaryati
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: qaryati_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaryati -d qaryati_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qaryati:${DB_PASSWORD}@db:5432/qaryati_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_VERIFIER_EMAIL: ${SEED_VERIFIER_EMAIL:-}
      SEED_VERIFIER_PASSWORD: ${SEED_VERIFIER_PASSWORD:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
